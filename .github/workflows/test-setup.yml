name: CI Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI tests
        shell: bash
        run: |
          set -o pipefail
          python tests/ci_test.py 2>&1 | tee ci_output.txt

      # Turns the failing lines into annotations, which show on the PR and in the
      # GitHub API without a login. Only runs when the tests step failed.
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          grep -n -A2 -E "FAIL|Traceback|Error|Results:" ci_output.txt | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Check prerequisites (Linux/macOS only)
        if: runner.os != 'Windows'
        run: |
          python3 -c "import sys; assert sys.version_info >= (3,10), 'Python too old'; print('Python version check: PASS')"
          pip3 --version > /dev/null 2>&1 && echo "pip3 check: PASS"
          git --version > /dev/null 2>&1 && echo "git check: PASS"
